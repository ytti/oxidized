  Type 'help' (and press <ENTER>) if you need any help using this.\r
  \e[6n\e[?2004h\e[?1l\e[?25l\e[0m\e[?7l\e[0m\e[J\e[0m\r\r
  \e[0m--{ running }--[  ]--\e[0m\r\r
  \e[0mA:srl-old#\e[10D\e[11C\e[?7h\e[0m\e[?12l\e[?25h
