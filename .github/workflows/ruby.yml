# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: CI

on: [ push, pull_request ]
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        os: [ubuntu-latest]
        # ubuntu-26.04 (ubuntu-latest) only provides Ruby >= 3.2
        include:
          - ruby-version: '3.0'
            os: ubuntu-24.04
          - ruby-version: '3.1'
            os: ubuntu-24.04
    continue-on-error: ${{ matrix.ruby-version == 'ruby-head' }}

    steps:
    - uses: actions/checkout@v7
    # rugged links libgit2 statically; on ubuntu-26.04 OpenSSL's static
    # dependencies (zstd, jitterentropy) are not installed by default
    - name: Install rugged build dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev libjitterentropy3-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake
